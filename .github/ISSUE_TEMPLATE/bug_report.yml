name: Bug 报告
description: 报告程序缺陷、异常崩溃或与预期不符的行为
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！提交前请先:
        1. 在 Issues 中搜索是否已有相同问题（含已关闭的）；
        2. 国内用户如访问 GitHub 缓慢，也可在 [Gitee Issues](https://gitee.com/chen-bohan3000/ai-gzt/issues) 反馈；
        3. 尽量把信息填写完整，信息越充分修复越快。

  - type: dropdown
    id: run-mode
    attributes:
      label: 运行方式
      options:
        - Windows 安装包（Inno Setup 安装的 exe）
        - 源码运行（python main.py）
        - 不确定
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 程序版本
      description: 安装包用户请在「关于」页查看版本号；源码用户填写 Git 提交号或下载日期。
      placeholder: 例如 v1.0 / 2026-09-10 源码
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: 操作系统
      placeholder: 例如 Windows 11 23H2 64位
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 按 1、2、3 列出可稳定复现的操作路径。
      placeholder: |
        1. 启动程序，进入……
        2. 点击……
        3. 观察到……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望表现
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际表现
      description: 报错信息请粘贴完整文本，不要只写"报错了"。
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志与截图
      description: 可在「操作日志」页导出日志；截图可直接粘贴到此处。涉及 API Key 等敏感信息请先打码。
      render: plain text

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 Issues，没有重复报告
          required: true
        - label: 我已确认配置文件中的 API Key 等敏感信息已打码
          required: true