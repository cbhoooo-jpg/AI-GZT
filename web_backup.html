<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件备份管理</title>
    <link rel="stylesheet" href="/static/element-ui.min.css">
    <script src="/static/vue.min.js"></script>
    <script src="/static/element-ui.min.js"></script>
    <script src="/static/axios.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f5f7fa;
            padding: 16px;
        }
        .form-card {
            max-width: 800px;
            margin: 0 auto;
        }
        .form-item-label {
            width: 120px;
            text-align: right;
            padding-right: 16px;
            line-height: 40px;
        }
        /* 所有按钮统一主色调 #409EFF */
        .el-button,
        .el-button--default,
        .el-button--primary,
        .el-button--success,
        .el-button--warning,
        .el-button--danger {
            background-color: #409EFF !important;
            border-color: #409EFF !important;
            color: #fff !important;
        }
        .el-button:hover,
        .el-button--default:hover,
        .el-button--primary:hover,
        .el-button--success:hover,
        .el-button--warning:hover,
        .el-button--danger:hover {
            background-color: #66b1ff !important;
            border-color: #66b1ff !important;
            color: #fff !important;
        }
        .el-button:active,
        .el-button--default:active,
        .el-button--primary:active,
        .el-button--success:active,
        .el-button--warning:active,
        .el-button--danger:active {
            background-color: #337ecc !important;
            border-color: #337ecc !important;
            color: #fff !important;
        }
        .el-button.is-disabled,
        .el-button[disabled] {
            background-color: #a0cfff !important;
            border-color: #a0cfff !important;
            color: #fff !important;
            cursor: not-allowed;
        }
        /* 输入框尾部按钮样式适配 */
        .el-input-group__append .el-button {
            border-radius: 0 4px 4px 0 !important;
        }
    </style>
</head>
<body>
    <div id="app">
<el-card class="form-card" shadow="hover">
            <div slot="header" style="display: flex; justify-content: space-between; align-items: center; font-size: 18px; font-weight: bold; color: #303133;">
                <span>文件备份管理</span>
                <el-button type="success" @click="saveBackupConfig" size="small" style="width: 120px;">保存备份配置</el-button>
            </div>
            <el-form :model="backupConfig" label-width="120px" ref="form">
                <!-- 第1行:备份功能开关 单独一行 -->
                <el-row :gutter="24" style="margin-bottom: 16px;">
                    <el-col span="24">
                        <el-form-item label="备份功能">
                            <el-switch v-model="backupConfig.enable_backup" active-text="开" inactive-text="关"></el-switch>
                        </el-form-item>
                    </el-col>
                </el-row>
                <!-- 第2行:全量备份+清空备份 单独一行 -->
                <el-row :gutter="24" style="margin-bottom: 16px;">
                    <el-col span="24">
                        <el-form-item>
                            <el-button type="success" @click="fullBackup" :loading="fullBackupLoading" :disabled="!backupConfig.enable_backup" style="margin-right: 16px; width: 100px;">全量备份</el-button>
                            <el-button type="danger" @click="cleanAllBackup" style="width: 100px;">清空备份</el-button>
                        </el-form-item>
                    </el-col>
                </el-row>
                <!-- 第3行:保留天数+最大备份数 单独一行 -->
                <el-row :gutter="24" style="margin-bottom: 16px;">
                    <el-col span="12">
                        <el-form-item label="保留天数">
                            <el-input-number v-model="backupConfig.retention_days" :min="1" :max="365" style="width: 100%;" controls-position="right"></el-input-number>
                        </el-form-item>
                    </el-col>
                    <el-col span="12">
                        <el-form-item label="最大备份数">
                            <el-input-number v-model="backupConfig.max_count" :min="10" :max="10000" style="width: 100%;" controls-position="right"></el-input-number>
                        </el-form-item>
                    </el-col>
                </el-row>
                <!-- 第4行:刷新备份列表+清理过期备份 单独一行 -->
                <el-row :gutter="24" style="margin-bottom: 16px;">
                    <el-col span="24">
                        <el-form-item>
                            <el-button type="primary" @click="loadBackupList" :loading="backupLoading" style="margin-right: 16px; width: 100px;">刷新列表</el-button>
                            <el-button type="warning" @click="cleanBackup" style="width: 100px;">清理过期</el-button>
                        </el-form-item>
                    </el-col>
                </el-row>
                <div style="text-align: right; margin-bottom: 16px;">
                    <span style="font-size: 12px; color: #909399;">共{{ backupList.length }}个备份文件</span>
                </div>
                    <el-collapse v-model="activeCollapse" style="margin-bottom: 16px;" v-loading="backupLoading">
                    <el-collapse-item 
                        v-for="project in groupedBackupList" 
                        :key="project.projectName" 
                        :title="`${project.projectName}（共${project.totalCount}个备份）`"
                        :name="project.projectName"
                    >
                        <!-- 项目内文件二级折叠面板 -->
                        <el-collapse v-model="activeFileCollapse" style="padding-left: 10px; margin-top: 8px;">
                            <el-collapse-item 
                                v-for="group in Object.values(project.fileGroups)" 
                                :key="`${project.projectName}/${group.original_path}`" 
                                :title="`${group.original_path}（共${group.count}个备份）`"
                                :name="`${project.projectName}/${group.original_path}`"
                            >
                                <div style="margin-bottom: 8px;">
                                    <el-button size="small" type="danger" @click="deleteSelectedBackups(group, project.projectName)">批量删除选中</el-button>
                                </div>
                                <el-table :data="group.list" border style="width: 100%;" :ref="`table_${project.projectName}_${group.original_path}`">
                                    <el-table-column type="selection" width="55" align="center"></el-table-column>
                                    <el-table-column prop="backup_time" label="备份时间" width="180"></el-table-column>
                                    <el-table-column prop="file_size" label="文件大小" width="120"></el-table-column>
                                    <el-table-column label="可恢复" width="100" align="center">
                                        <template slot-scope="scope">
                                            <el-tag v-if="scope.row.restorable" type="success" size="small">是</el-tag>
                                            <el-tag v-else type="info" size="small">否</el-tag>
                                        </template>
                                    </el-table-column>
                                    <el-table-column label="操作" width="180" align="center">
                                        <template slot-scope="scope">
                                            <el-button size="small" type="primary" @click="restoreBackup(scope.row)" :disabled="!scope.row.restorable">恢复</el-button>
                                            <el-button size="small" type="danger" @click="deleteBackup(scope.row)">删除</el-button>
                                        </template>
                                    </el-table-column>
                                </el-table>
                            </el-collapse-item>
                        </el-collapse>
                    </el-collapse-item>
                </el-collapse>

            </el-form>
        </el-card>
    </div>

    <script>
        new Vue({
            el: '#app',
            data() {
                return {
                    apiBase: '/api',
                    backupList: [],
                    backupLoading: false,
                    fullBackupLoading: false,
                    backupConfig: {
                        enable_backup: true,
                        retention_days: 30,
                        max_count: 1000
                    },
                    activeCollapse: [],
                    activeFileCollapse: []
                }
            },
            computed: {
                groupedBackupList() {
                    const projectGroups = {}
                    this.backupList.forEach(item => {
                        // 去除冗余的仓库文件夹前缀
                        let cleanPath = item.original_path.replace(/^仓库文件夹[\\/]/, '')
                        // 拆分项目名和项目内相对路径
                        const pathSegments = cleanPath.split(/[\\/]/)
                        const projectName = pathSegments[0]
                        const innerFilePath = pathSegments.slice(1).join('/')
                        
                        // 初始化项目一级分组
                        if (!projectGroups[projectName]) {
                            projectGroups[projectName] = {
                                projectName: projectName,
                                totalCount: 0,
                                fileGroups: {}
                            }
                        }
                        // 初始化项目内文件二级分组
                        if (!projectGroups[projectName].fileGroups[innerFilePath]) {
                            projectGroups[projectName].fileGroups[innerFilePath] = {
                                original_path: innerFilePath,
                                list: [],
                                count: 0,
                                restorable: item.restorable
                            }
                        }
                        // 追加备份记录
                        projectGroups[projectName].fileGroups[innerFilePath].list.push(item)
                        projectGroups[projectName].fileGroups[innerFilePath].count += 1
                        projectGroups[projectName].totalCount += 1
                    })
                    // 按项目名称升序排列
                    return Object.values(projectGroups).sort((a, b) => a.projectName.localeCompare(b.projectName, 'zh-CN'))
                }
            },
            mounted() {
                this.loadBackupConfig()
                this.loadBackupList()
            },
            methods: {
                // 加载备份配置
                async loadBackupConfig() {
                    try {
                        const res = await axios.get(`${this.apiBase}/config/get`)
                        if (res.data.code === 200) {
                            this.backupConfig = res.data.data.backup_config || this.backupConfig
                        }
                    } catch (e) {
                        this.$message.error('加载备份配置失败:' + e.message)
                    }
                },
                // 保存备份配置
                async saveBackupConfig() {
                    try {
                        const res = await axios.get(`${this.apiBase}/config/get`)
                        let config = res.data.data
                        config.backup_config = this.backupConfig
                        await axios.post(`${this.apiBase}/config/set`, {
                            config: config
                        })
                        this.$message.success('备份配置保存成功，即时生效！')
                    } catch (e) {
                        this.$message.error('保存失败:' + (e.response?.data?.msg || e.response?.data?.detail || e.message))
                    }
                },
                // 加载备份列表
                async loadBackupList() {
                    this.backupLoading = true
                    try {
                        const res = await axios.get(`${this.apiBase}/backup/list`)
                        if (res.data.code === 200) {
                            this.backupList = res.data.data
                        }
                    } catch (e) {
                        this.$message.error('加载备份列表失败:' + (e.response?.data?.detail || e.message))
                    } finally {
                        this.backupLoading = false
                    }
                },
                // 恢复备份
                async restoreBackup(row) {
                    this.$confirm(`确定要恢复备份文件【${row.original_path}】吗？恢复后当前文件会被覆盖，系统会自动备份当前版本`, '提示', {
                        confirmButtonText: '确定',
                        cancelButtonText: '取消',
                        type: 'warning'
                    }).then(async () => {
                        try {
                            await axios.post(`${this.apiBase}/backup/restore`, {
                            backup_file_name: row.backup_file
                    })
                            this.$message.success('恢复成功！')
                            this.loadBackupList()
                        } catch (e) {
                            this.$message.error('恢复失败:' + (e.response?.data?.detail || e.message))
                        }
                    })
                },
                // 全量备份所有文件
                async fullBackup() {
                    this.$confirm(`确定要执行全量文件备份吗？将备份当前所有项目文件到独立备份版本`, '提示', {
                        confirmButtonText: '确定',
                        cancelButtonText: '取消',
                        type: 'warning'
                    }).then(async () => {
                        this.fullBackupLoading = true
                        try {
                            const res = await axios.post(`${this.apiBase}/backup/full`)
                            this.$message.success(res.data.msg)
                            this.loadBackupList()
                        } catch (e) {
                            this.$message.error('全量备份失败:' + (e.response?.data?.detail || e.message))
                        } finally {
                            this.fullBackupLoading = false
                        }
                    })
                },
                // 删除备份
                async deleteBackup(row) {
                    this.$confirm(`确定要删除备份文件【${row.original_path}】吗？删除后无法恢复`, '提示', {
                        confirmButtonText: '确定',
                        cancelButtonText: '取消',
                        type: 'warning'
                    }).then(async () => {
                        try {
                            await axios.post(`${this.apiBase}/backup/delete`, {
                                backup_file_name: row.backup_file
                    })
                            this.$message.success('删除成功！')
                            this.loadBackupList()
                        } catch (e) {
                            this.$message.error('删除失败:' + (e.response?.data?.detail || e.message))
                        }
                    })
                },
                // 清理过期备份
                async cleanBackup() {
                    this.$confirm(`确定要清理所有过期备份吗？将删除超过${this.backupConfig.retention_days}天或超过${this.backupConfig.max_count}个的最早备份`, '提示', {
                        confirmButtonText: '确定',
                        cancelButtonText: '取消',
                        type: 'warning'
                    }).then(async () => {
                        try {
                            const res = await axios.post(`${this.apiBase}/backup/clean`, {
                                retention_days: this.backupConfig.retention_days,
                                max_count: this.backupConfig.max_count
                            })
                            this.$message.success(res.data.msg)
                            this.loadBackupList()
                        } catch (e) {
                            this.$message.error('清理失败:' + (e.response?.data?.detail || e.message))
                        }
                    })
                },
                // 清空所有备份
                async cleanAllBackup() {
                    this.$confirm(`确定要清空所有备份文件吗？操作不可恢复，所有备份都会被永久删除`, '警告', {
                        confirmButtonText: '确定',
                        cancelButtonText: '取消',
                        type: 'error'
                    }).then(async () => {
                        try {
                            // 批量删除所有备份
                            const deletePromises = this.backupList.map(item => 
                                axios.post(`${this.apiBase}/backup/delete`, { backup_file_name: item.backup_file })
                            )
                            await Promise.all(deletePromises)
                            this.$message.success(`已成功清空所有${this.backupList.length}个备份文件`)
                            this.loadBackupList()
                        } catch (e) {
                            this.$message.error('清空失败:' + (e.response?.data?.detail || e.message))
                        }
                    })
                },
                // 批量删除选中的备份
                async deleteSelectedBackups(group, projectName = '') {
                    const tableRef = this.$refs[`table_${projectName}_${group.original_path}`]
                    // 循环生成的ref在Vue2中为数组，取第一个实例兼容处理
                    const tableInstance = Array.isArray(tableRef) ? tableRef[0] : tableRef
                    const selected = tableInstance?.selection || []
                    if (!selected.length) {
                        this.$message.warning('请先选择要删除的备份')
                        return
                    }
                    this.$confirm(`确定要删除选中的${selected.length}个备份吗？删除后无法恢复`, '提示', {
                        confirmButtonText: '确定',
                        cancelButtonText: '取消',
                        type: 'warning'
                    }).then(async () => {
                        try {
                            const deletePromises = selected.map(item => 
                                axios.post(`${this.apiBase}/backup/delete`, { backup_file_name: item.backup_file })
                            )
                            await Promise.all(deletePromises)
                            this.$message.success(`已成功删除${selected.length}个备份`)
                            this.loadBackupList()
                        } catch (e) {
                            this.$message.error('批量删除失败:' + (e.response?.data?.detail || e.message))
                        }
                    })
                }
            }
        })
    </script>
</body>
</html>
