<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>操作日志</title>
    <link rel="stylesheet" href="/static/element-ui.min.css">
    <script src="/static/vue.min.js"></script>
    <script src="/static/element-ui.min.js"></script>
    <script src="/static/axios.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html, #app {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f5f7fa;
        }
        .log-container {
            height: 100%;
            padding: 16px;
            display: flex;
            flex-direction: column;
        }
        .log-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-shrink: 0;
        }
        .log-list {
            flex: 1;
            overflow: auto;
            background: #fff;
            border-radius: 4px;
            padding: 16px;
        }
        .log-item {
            padding: 12px;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        .log-item:last-child {
            border-bottom: none;
        }
        .log-item:hover {
            background: #fafafa;
        }
        .log-type {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            color: #fff;
            margin-right: 8px;
        }
        .log-type.file { background: #67c23a; }
        .log-type.config { background: #e6a23c; }
        .log-type.project { background: #409eff; }
        .log-type.log { background: #909399; }
        .log-type.ai { background: #9c27b0; } /* AI操作专属紫色标签 */
        .log-type.error { background: #f56c6c; } /* 错误操作专属红色标签 */
        .log-status.error { color: #f56c6c; font-weight: bold; }
        .log-status.success { color: #67c23a; font-weight: bold; }
        .log-content {
            flex: 1;
            font-size: 14px;
            color: #333;
            line-height: 1.5;
        }
        .log-time {
            font-size: 12px;
            color: #999;
            white-space: nowrap;
            margin-left: 16px;
        }
    </style>
</head>
<body>
    <div id="app" class="log-container">
        <div class="log-toolbar">
            <el-input 
                placeholder="搜索日志内容" 
                v-model="keyword" 
                style="width: 300px;"
                @keyup.enter.native="loadLogs"
                clearable
            >
                <i slot="prefix" class="el-input__icon el-icon-search"></i>
            </el-input>
            <el-button type="danger" @click="clearLogs">清空所有日志</el-button>
        </div>
        <div class="log-list">
            <div v-for="log in logList" :key="log.id" class="log-item">
                <div class="log-content">
                    <span :class="['log-type', getTypeClass(log.oper_type)]">{{ log.oper_type }}</span>
                    <span :class="['log-status', log.status]">{{ log.content }}</span>
                </div>
                <span class="log-time">{{ log.oper_time }}</span>
            </div>
            <div v-if="logList.length === 0" style="text-align: center; color: #999; padding: 40px 0;">
                暂无操作日志
            </div>
        </div>
        <el-pagination
            style="margin-top: 16px; text-align: right; flex-shrink: 0;"
            @size-change="handleSizeChange"
            @current-change="handleCurrentChange"
            :current-page="page"
            :page-sizes="[20, 50, 100]"
            :page-size="pageSize"
            layout="total, sizes, prev, pager, next, jumper"
            :total="total"
        >
        </el-pagination>
    </div>

    <script>
            new Vue({
                el: '#app',
                data() {
                    return {
                        logList: [],
                        keyword: '',
                        page: 1,
                        pageSize: 50,
                        total: 0,
                        apiBase: '/api',
                        lastMaxId: 0, // 上次拉取的最大日志ID，用于增量拉取
                        autoScroll: true, // 自动滚动开关
                        isLoading: false, // 防止请求重入标志位
                        pollingTimer: null, // 轮询定时器实例
                        isPollingPaused: false // 网络异常时暂停轮询标志位
                    }
                },
                mounted() {
                    this.loadLogs()
                    // 等DOM渲染完成后再绑定滚动事件
                    this.$nextTick(() => {
                        const logEl = document.querySelector('.log-list')
                        if (logEl) {
                            // 监听滚动，判断是否开启自动滚动
                            logEl.addEventListener('scroll', (e) => {
                                // 滚动到底部200px以内自动开启滚动，否则关闭
                                this.autoScroll = e.target.scrollTop + e.target.clientHeight >= e.target.scrollHeight - 200
                            })
                        }
                        // 启动可控的轮询定时器
                        this.startPolling()
                    })
                    // 监听页面可见性，页面隐藏时暂停轮询，可见时恢复，避免后台积压请求耗尽连接池
                    document.addEventListener('visibilitychange', this.handleVisibilityChange)
                },
                beforeDestroy() {
                    // 组件销毁前清理定时器，避免内存泄漏
                    this.stopPolling()
                    document.removeEventListener('visibilitychange', this.handleVisibilityChange)
                },
                methods: {
                    // 全量加载日志（翻页、搜索、清空时调用）
                    async loadLogs() {
                        try {
                            const res = await axios.get(`${this.apiBase}/log/list`, {
                                params: {
                                    keyword: this.keyword,
                                    page: this.page,
                                    page_size: this.pageSize
                                }
                            })
                            if (res.data.code === 200) {
                                this.logList = res.data.data.list
                                this.total = res.data.data.total
                                // 记录当前最大日志ID，用于增量拉取
                                if (this.logList.length > 0) {
                                    this.lastMaxId = Math.max(...this.logList.map(log => log.id))
                                }
                                // 自动滚动到底部
                                this.$nextTick(() => {
                                    const logEl = document.querySelector('.log-list')
                                    if (logEl) logEl.scrollTop = logEl.scrollHeight
                                })
                            }
                        } catch (e) {
                            console.error('加载日志失败', e)
                        }
                    },
                    // 增量加载新日志（轮询调用，低延时）
                    async loadIncrementLogs() {
                        // 网络异常暂停期间不发请求，搜索、非第一页时不增量拉取，避免混乱
                        if (this.isPollingPaused || this.keyword || this.page !== 1) return
                        // 防重入:上一次请求未完成则跳过本次，避免请求积压耗尽连接池
                        if (this.isLoading) return
                        this.isLoading = true
                        try {
                            const res = await axios.get(`${this.apiBase}/log/list`, {
                                params: {
                                    last_id: this.lastMaxId,
                                    page_size: 100
                                }
                            })
                            if (res.data.code === 200 && res.data.data.list.length > 0) {
                                // 新日志追加到列表顶部
                                this.logList.unshift(...res.data.data.list)
                                // 更新最大ID
                                this.lastMaxId = Math.max(...res.data.data.list.map(log => log.id), this.lastMaxId)
                                // 自动滚动到底部
                                if (this.autoScroll) {
                                    this.$nextTick(() => {
                                        const logEl = document.querySelector('.log-list')
                                        if (logEl) logEl.scrollTop = logEl.scrollHeight
                                    })
                                }
                            }
                        } catch (e) {
                            console.error('增量加载日志失败', e)
                            // 网络异常时暂停轮询30秒，避免疯狂发请求导致连接池耗尽
                            this.pausePolling()
                        } finally {
                            this.isLoading = false
                        }
                    },
                    // 启动轮询定时器
                    startPolling() {
                        if (this.pollingTimer) return
                        this.pollingTimer = setInterval(() => {
                            this.loadIncrementLogs()
                        }, 1000)
                    },
                    // 停止轮询定时器
                    stopPolling() {
                        if (this.pollingTimer) {
                            clearInterval(this.pollingTimer)
                            this.pollingTimer = null
                        }
                    },
                    // 网络异常时暂停轮询30秒
                    pausePolling() {
                        this.isPollingPaused = true
                        this.stopPolling()
                        setTimeout(() => {
                            this.isPollingPaused = false
                            this.startPolling()
                        }, 30000)
                    },
                    // 页面可见性变化处理
                    handleVisibilityChange() {
                        if (document.hidden) {
                            // 页面隐藏时停止轮询，避免后台积压请求
                            this.stopPolling()
                        } else {
                            // 页面可见时恢复轮询
                            if (!this.isPollingPaused) {
                                this.startPolling()
                            }
                        }
                    },
                    handleSizeChange(val) {
                        this.pageSize = val
                        this.loadLogs()
                    },
                    handleCurrentChange(val) {
                        this.page = val
                        this.loadLogs()
                    },
                    async clearLogs() {
                        this.$confirm('确定要清空所有操作日志吗？', '提示', {
                            confirmButtonText: '确定',
                            cancelButtonText: '取消',
                            type: 'warning'
                        }).then(async () => {
                            try {
                                const res = await axios.post(`${this.apiBase}/log/clear`)
                                if (res.data.code === 200) {
                                    this.$message.success(res.data.msg)
                                    this.loadLogs()
                                }
                            } catch (e) {
                                this.$message.error('清空日志失败')
                            }
                        }).catch(() => {})
                    },
                    getTypeClass(type) {
                        if (type.includes('错误') || type.includes('失败') || type.includes('异常')) return 'error'
                        if (type.includes('文件')) return 'file'
                        if (type.includes('配置')) return 'config'
                        if (type.includes('项目')) return 'project'
                        if (type.includes('AI') || type.includes('ai')) return 'ai'
                        return 'log'
                    }
                }
            })
    </script>
</body>
</html>
